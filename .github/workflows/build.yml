name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Inspect SSV API
        run: |
          gradle copySsvInspect
          SSV_JAR=$(find build/ssvInspect -name '*.jar' | head -n 1)
          echo "SSV_JAR=$SSV_JAR"
          jar tf "$SSV_JAR" | grep -Ei 'sound|disc|playlist|storage|jukebox|etched|compat|relay' | head -n 400
          echo "===== PlaylistHelper ====="
          javap -classpath "$SSV_JAR" -p -c 'com.azulc.ongakumod.util.PlaylistHelper' || true
          echo "===== DiscContainer ====="
          javap -classpath "$SSV_JAR" -p -c 'com.azulc.ongakumod.container.DiscContainer' || true
          echo "===== DiscRackBlockEntity ====="
          javap -classpath "$SSV_JAR" -p -c 'com.azulc.ongakumod.blockentity.DiscRackBlockEntity' || true
          echo "===== JukeboxHelper ====="
          javap -classpath "$SSV_JAR" -p -c 'com.azulc.ongakumod.util.JukeboxHelper' || true
          echo "===== EtchedBridge ====="
          javap -classpath "$SSV_JAR" -p -c 'com.azulc.ongakumod.compat.EtchedBridge' || true

      - name: Build
        run: gradle build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mdm-playlist-importer
          path: build/libs/*.jar
          if-no-files-found: error
